<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거래글 수정 - D2PAMING</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">
        <div class="form-container form-wide glassmorphism" style="border:none;">
            <h2>거래글 수정</h2>

            <form th:action="@{/board/edit/{id}(id=${postId})}" th:object="${postForm}" method="post">
                <div class="form-group">
                    <label for="tradeStatus">거래 상태</label>
                    <select id="tradeStatus" th:field="*{tradeStatus}">
                        <option value="SELLING">판매중</option>
                        <option value="SOLD">거래완료</option>
                    </select>
                </div>

                <div class="form-group" style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label for="serverType">서버</label>
                        <select id="serverType" th:field="*{serverType}">
                            <option th:each="server : ${servers}" th:value="${server}" th:text="${server.description}"></option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label for="category">카테고리</label>
                        <select id="category" th:field="*{category}">
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.description}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="itemName">아이템 선택</label>
                    <select id="itemName" th:field="*{itemName}" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-primary); outline: none; transition: border-color 0.2s;">
                        <option value="">-- 판매할 아이템을 선택하세요 --</option>
                        <option th:each="name : ${itemNames}" th:value="${name}" th:text="${name}"></option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('itemName')}" th:errors="*{itemName}"></span>
                </div>

                <div class="form-group">
                    <label for="title">글 제목</label>
                    <input type="text" id="title" th:field="*{title}">
                    <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                </div>

                <div class="form-group" style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label for="currencyType">요구 화폐</label>
                        <select id="currencyType" th:field="*{currencyType}">
                            <option th:each="curr : ${currencies}" th:value="${curr}" th:text="${curr.description}"></option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label for="currencyName">상세 화폐명 (예: 베르)</label>
                        <input type="text" id="currencyName" th:field="*{currencyName}" placeholder="DP 거래시 공란">
                    </div>
                    <div style="flex:1;">
                        <label for="priceAmount">수량 (개/DP)</label>
                        <input type="number" id="priceAmount" th:field="*{priceAmount}" min="1">
                    </div>
                </div>

                <div class="form-group">
                    <label for="content">추가 설명 (변동 옵션, 거래 가능 시간 등)</label>
                    <textarea id="content" th:field="*{content}" rows="10"></textarea>
                    <span class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
                </div>
                <div class="form-actions">
                    <a th:href="@{/board/detail/{id}(id=${postId})}" class="btn btn-secondary">취소</a>
                    <button type="submit" class="btn btn-primary">수정</button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
