<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Header Fragment -->
<header th:fragment="header">
    <script>
        (function() {
            var savedTheme = localStorage.getItem('d2-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <nav class="d2-nav">
        <div class="nav-container">
            <a href="/" class="logo">
                <span class="logo-d2">D2</span>PAMING
            </a>
            <div class="nav-links">
                <div class="dropdown">
                    <a href="/board/list" class="dropbtn">아이템 마켓</a>
                    <div class="dropdown-content">
                        <a href="/board/list?server=LADDER">래더 서버 아이템</a>
                        <a href="/board/list?server=STANDARD">스탠다드 서버 아이템</a>
                        <a href="/board/create" class="sell-link">아이템 판매 등록</a>
                    </div>
                </div>
                <!-- 커뮤니티 등 추가 메뉴자리 -->
                <a href="#">커뮤니티</a>
            </div>
            <div class="nav-user">
                <span sec:authorize="isAuthenticated()">
                    <span class="user-info" sec:authentication="name"></span> 님
                    <form th:action="@{/auth/logout}" method="post" style="display:inline;">
                        <button type="submit" class="btn-link">로그아웃</button>
                    </form>
                </span>
                <span sec:authorize="isAnonymous()">
                    <a href="/auth/login">로그인</a>
                </span>
            </div>
        </div>
    </nav>
</header>

<!-- Footer Fragment -->
<footer th:fragment="footer">
    <!-- Speed Dial Floating Action Menu -->
    <div class="speed-dial" id="speed-dial">
        <div class="speed-dial-menu" id="speed-dial-menu">
            <a href="#" onclick="toggleTheme(); return false;" class="sd-btn" title="테마 변경">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                </svg>
                <span class="sd-tooltip">다크 / 라이트 모드</span>
            </a>
            <a href="/board/create" class="sd-btn" title="판매 등록">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
                <span class="sd-tooltip">판매 등록</span>
            </a>
            <a href="/board/list" class="sd-btn" title="아이템 마켓">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                     <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                     <line x1="3" y1="9" x2="21" y2="9"></line>
                     <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
                <span class="sd-tooltip">아이템 마켓</span>
            </a>
            <a href="#" onclick="window.scrollTo({top:0, behavior:'smooth'}); return false;" class="sd-btn" title="위로 가기">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 15l-6-6-6 6"/>
                </svg>
                <span class="sd-tooltip">TOP</span>
            </a>
        </div>
        <button class="speed-dial-main" id="speed-dial-main-btn" title="메뉴" onclick="document.getElementById('speed-dial').classList.toggle('active');">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="sd-icon-plus">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
    </div>

    <div class="footer-container">
        <p>&copy; 2026 D2PAMING — 디아블로2 리저렉션 커뮤니티 &amp; 아이템 거래소</p>
    </div>

    <script>
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('d2-theme', next);
        }
    </script>
</footer>

</html>
